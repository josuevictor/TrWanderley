{% for c in categories %}
<tr class="border-b border-slate-100 dark:border-slate-800">
  <td class="px-4 py-3">{{ c.name }}</td>
  <td class="px-4 py-3">{{ c.get_kind_display }}</td>
  <td class="px-4 py-3">{% if c.is_active %}Sim{% else %}Não{% endif %}</td>
  <td class="px-4 py-3 text-sm whitespace-nowrap">
    <a href="{% url 'finance:category_detail' c.pk %}" class="text-sky-600 hover:underline dark:text-sky-400">Ver</a>
    <span class="text-slate-300 dark:text-slate-600">·</span>
    <a href="{% url 'finance:category_edit' c.pk %}" class="text-sky-600 hover:underline dark:text-sky-400">Editar</a>
  </td>
</tr>
{% empty %}
<tr><td colspan="4" class="px-4 py-8 text-center text-slate-500">Nenhuma categoria ainda.</td></tr>
{% endfor %}

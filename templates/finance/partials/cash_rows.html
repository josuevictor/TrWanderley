{% for m in movements %}
<tr class="border-b border-slate-100 dark:border-slate-800">
  <td class="px-4 py-3 whitespace-nowrap">{{ m.movement_date|date:"d/m/Y" }}</td>
  <td class="px-4 py-3">{{ m.get_kind_display }}</td>
  <td class="px-4 py-3">{{ m.financial_account.name }}</td>
  <td class="px-4 py-3 text-right font-mono">{{ m.amount|floatformat:2 }}</td>
  <td class="px-4 py-3">{% if m.payment_method %}{{ m.payment_method.name }}{% else %}—{% endif %}</td>
  <td class="px-4 py-3 text-slate-600 dark:text-slate-400">{{ m.memo|default:"—" }}</td>
  <td class="px-4 py-3 text-sm whitespace-nowrap">
    <a href="{% url 'finance:cash_detail' m.pk %}" class="text-sky-600 hover:underline dark:text-sky-400">Ver</a>
    <span class="text-slate-300 dark:text-slate-600">·</span>
    <a href="{% url 'finance:cash_edit' m.pk %}" class="text-sky-600 hover:underline dark:text-sky-400">Editar</a>
  </td>
</tr>
{% empty %}
<tr><td colspan="7" class="px-4 py-8 text-center text-slate-500">Sem movimentos.</td></tr>
{% endfor %}

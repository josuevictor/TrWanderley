{% for a in accounts %}
<tr class="border-b border-slate-100 dark:border-slate-800">
  <td class="px-4 py-3">{{ a.name }}</td>
  <td class="px-4 py-3">{{ a.get_kind_display }}</td>
  <td class="px-4 py-3">{% if a.is_active %}Sim{% else %}Não{% endif %}</td>
  <td class="px-4 py-3 text-sm whitespace-nowrap">
    <a href="{% url 'finance:account_detail' a.pk %}" class="text-sky-600 hover:underline dark:text-sky-400">Ver</a>
    <span class="text-slate-300 dark:text-slate-600">·</span>
    <a href="{% url 'finance:account_edit' a.pk %}" class="text-sky-600 hover:underline dark:text-sky-400">Editar</a>
  </td>
</tr>
{% empty %}
<tr><td colspan="4" class="px-4 py-8 text-center text-slate-500">Nenhuma conta.</td></tr>
{% endfor %}
